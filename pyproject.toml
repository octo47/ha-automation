[project]
name = "ha-room-climate"
version = "0.1.0"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-homeassistant-custom-component==0.13.372",
  "ruff",
  "pyright",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]

[tool.pyright]
include = ["custom_components/room_climate"]
typeCheckingMode = "strict"
