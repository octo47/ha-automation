# The bench view of the Room Climate dashboard.
#
# The knobs, the virtual valves and the virtual boiler of the simulation house. The view drives
# the knob table of the spec's section 8.1 step 8. A simulated entry names only sim_ entities,
# so the bench touches no real valve and it cannot start the real boiler.
#
# The room names below are the example rooms of the specification. Replace each one with the
# room id of the simulated entry.

title: Room Climate Bench
path: room-climate-bench
icon: mdi:flask-outline
cards:
  # The virtual boiler, its firing signal, the outdoor knob and the house signals of the entry.
  - type: entities
    title: House
    entities:
      - entity: climate.sim_boiler
      - entity: binary_sensor.sim_boiler_firing
      - entity: number.sim_outdoor_temperature
      - entity: sensor.room_climate_status
      - entity: switch.room_climate_boiler_automation
      - entity: switch.room_climate_lockout_override

  # One card per room: the virtual valve, its position, the three knobs and the two switches.
  - type: entities
    title: Front Room
    entities:
      - entity: climate.sim_front_room_valve
      - entity: sensor.sim_front_room_valve_position
      - entity: number.sim_front_room_room_temperature
      - entity: number.sim_front_room_valve_local_temperature
      - entity: number.sim_front_room_valve_external_measured_room_sensor
      - entity: switch.sim_front_room_window
      - entity: switch.sim_front_room_offline
      - entity: binary_sensor.sim_front_room_heat_required
  - type: entities
    title: Back Room
    entities:
      - entity: climate.sim_back_room_valve
      - entity: sensor.sim_back_room_valve_position
      - entity: number.sim_back_room_room_temperature
      - entity: number.sim_back_room_valve_local_temperature
      - entity: number.sim_back_room_valve_external_measured_room_sensor
      - entity: switch.sim_back_room_window
      - entity: switch.sim_back_room_offline
      - entity: binary_sensor.sim_back_room_heat_required
  - type: entities
    title: Side Room
    entities:
      - entity: climate.sim_side_room_valve
      - entity: sensor.sim_side_room_valve_position
      - entity: number.sim_side_room_room_temperature
      - entity: number.sim_side_room_valve_local_temperature
      - entity: number.sim_side_room_valve_external_measured_room_sensor
      - entity: switch.sim_side_room_window
      - entity: switch.sim_side_room_offline
      - entity: binary_sensor.sim_side_room_heat_required
